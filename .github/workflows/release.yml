name: NuGet Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - ".github/workflows/release.yml"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "AutoPolicy.slnx"
      - "Directory.Build.props"
      - "LICENSE"
      - "README.md"
      - "README.NUGET.md"
      - "CHANGELOG.md"
      - "src/**"
      - "tests/**"
      - "smoke/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-validate:
    name: Build and validate package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || 'v0.1.0' }}
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $versionNode = $props.SelectSingleNode("/Project/PropertyGroup/AutoPolicyVersion")
          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
              throw "AutoPolicyVersion is missing from Directory.Build.props."
          }

          $version = $versionNode.InnerText.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version"

          $expectedTag = "v$version"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
              if ($env:GITHUB_REF_NAME -ne $expectedTag) {
                  throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$version'. Expected '$expectedTag'."
              }
          }
          else {
              if ($version -ne "0.1.0") {
                  throw "The one-time branch release path is restricted to AutoPolicy 0.1.0."
              }

              git fetch origin --tags --quiet
              $tagSha = (git rev-list -n 1 $expectedTag).Trim()
              $expectedSha = "1d9efff9f5e6830fd20ad104136a95baad701e8a"
              if ($tagSha -ne $expectedSha) {
                  throw "Release tag '$expectedTag' points to '$tagSha'; expected '$expectedSha'."
              }
          }

      - name: Test
        run: dotnet test AutoPolicy.slnx --configuration Release

      - name: Pack
        run: dotnet pack src/AutoPolicy/AutoPolicy.csproj --configuration Release --output artifacts

      - name: Validate package contents and metadata
        shell: pwsh
        run: ./scripts/Validate-Packages.ps1 -ArtifactsPath ./artifacts

      - name: Restore packaged consumer smoke test
        run: >-
          dotnet restore smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj
          --configfile smoke/AutoPolicy.ConsumerSmoke/NuGet.config
          --packages artifacts/.smoke-packages
          --no-cache

      - name: Run packaged consumer smoke test
        run: dotnet run --project smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj --configuration Release --no-restore

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: autopolicy-release-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet.org
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: autopolicy-release-package
          path: artifacts

      - name: NuGet login via Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/AutoPolicy.${VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AutoPolicy ${VERSION}" \
              --generate-notes \
              --verify-tag
          fi
