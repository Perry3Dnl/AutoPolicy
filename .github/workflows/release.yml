name: NuGet Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Directory.Build.props"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "AutoPolicy.slnx"
      - "Directory.Build.props"
      - "LICENSE"
      - "README.md"
      - "README.NUGET.md"
      - "CHANGELOG.md"
      - "assets/**"
      - "src/**"
      - "tests/**"
      - "smoke/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuget-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-version-tag:
    name: Create version tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create tag for package version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $versionNode = $props.SelectSingleNode("/Project/PropertyGroup/AutoPolicyVersion")
          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
              throw "AutoPolicyVersion is missing from Directory.Build.props."
          }

          $version = $versionNode.InnerText.Trim()
          $tag = "v$version"

          gh api "/repos/$env:GITHUB_REPOSITORY/git/ref/tags/$tag" --silent 2>$null
          if ($LASTEXITCODE -eq 0) {
              Write-Host "Tag $tag already exists."
              exit 0
          }

          gh api --method POST "/repos/$env:GITHUB_REPOSITORY/git/refs" `
              -f ref="refs/tags/$tag" `
              -f sha="$env:GITHUB_SHA"

          Write-Host "Created tag $tag at $env:GITHUB_SHA"

  build-and-validate:
    name: Build and validate package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate release version
        id: version
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $versionNode = $props.SelectSingleNode("/Project/PropertyGroup/AutoPolicyVersion")
          if ($null -eq $versionNode -or [string]::IsNullOrWhiteSpace($versionNode.InnerText)) {
              throw "AutoPolicyVersion is missing from Directory.Build.props."
          }

          $version = $versionNode.InnerText.Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version: $version"

          if ($env:GITHUB_REF_TYPE -eq "tag") {
              $expectedTag = "v$version"
              if ($env:GITHUB_REF_NAME -ne $expectedTag) {
                  throw "Release tag '$env:GITHUB_REF_NAME' does not match package version '$version'. Expected '$expectedTag'."
              }

              git fetch origin main --quiet
              $mainSha = (git rev-parse origin/main).Trim()
              if ($env:GITHUB_SHA -ne $mainSha) {
                  throw "Release tag must point at the current main commit. Tag: $env:GITHUB_SHA; main: $mainSha"
              }
          }

      - name: Test
        run: dotnet test AutoPolicy.slnx --configuration Release

      - name: Pack
        run: dotnet pack src/AutoPolicy/AutoPolicy.csproj --configuration Release --output artifacts

      - name: Validate package contents and metadata
        shell: pwsh
        run: ./scripts/Validate-Packages.ps1 -ArtifactsPath ./artifacts

      - name: Restore packaged consumer smoke test
        run: >-
          dotnet restore smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj
          --configfile smoke/AutoPolicy.ConsumerSmoke/NuGet.config
          --packages artifacts/.smoke-packages
          --no-cache

      - name: Run packaged consumer smoke test
        run: dotnet run --project smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj --configuration Release --no-restore

      - name: Upload release package
        uses: actions/upload-artifact@v4
        with:
          name: autopolicy-release-package
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish to NuGet.org
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download release package
        uses: actions/download-artifact@v4
        with:
          name: autopolicy-release-package
          path: artifacts

      - name: NuGet login via Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish package
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          EXTRA_ARGS=""
          if [ "$RUN_ATTEMPT" -gt 1 ]; then
            EXTRA_ARGS="--skip-duplicate"
          fi

          dotnet nuget push "artifacts/AutoPolicy.${VERSION}.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            $EXTRA_ARGS

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build-and-validate.outputs.version }}
        run: |
          TAG="v${VERSION}"

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release ${TAG} already exists."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "AutoPolicy ${VERSION}" \
              --generate-notes \
              --verify-tag
          fi
