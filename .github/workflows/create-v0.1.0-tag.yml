name: Publish AutoPolicy 0.1.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/create-v0.1.0-tag.yml"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Validate and publish v0.1.0
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: v0.1.0
          fetch-depth: 0

      - name: Verify release tag target
        shell: bash
        run: |
          set -euo pipefail
          TAG_SHA="$(git rev-list -n 1 v0.1.0)"
          EXPECTED_SHA="1d9efff9f5e6830fd20ad104136a95baad701e8a"
          if [ "$TAG_SHA" != "$EXPECTED_SHA" ]; then
            echo "v0.1.0 points to $TAG_SHA, expected $EXPECTED_SHA."
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test AutoPolicy.slnx --configuration Release

      - name: Pack
        run: dotnet pack src/AutoPolicy/AutoPolicy.csproj --configuration Release --output artifacts

      - name: Validate package contents and metadata
        shell: pwsh
        run: ./scripts/Validate-Packages.ps1 -ArtifactsPath ./artifacts

      - name: Restore packaged consumer smoke test
        run: >-
          dotnet restore smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj
          --configfile smoke/AutoPolicy.ConsumerSmoke/NuGet.config
          --packages artifacts/.smoke-packages
          --no-cache

      - name: Run packaged consumer smoke test
        run: dotnet run --project smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj --configuration Release --no-restore

      - name: NuGet login via Trusted Publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish AutoPolicy 0.1.0
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          dotnet nuget push "artifacts/AutoPolicy.0.1.0.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release v0.1.0 already exists."
          else
            gh release create v0.1.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "AutoPolicy 0.1.0" \
              --generate-notes \
              --verify-tag
          fi
