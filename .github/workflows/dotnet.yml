name: .NET

on:
  push:
    paths:
      - "Directory.Build.props"
      - "LICENSE"
      - "README.md"
      - "README.NUGET.md"
      - "CHANGELOG.md"
      - "platforms/dotnet/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "Directory.Build.props"
      - "LICENSE"
      - "README.md"
      - "README.NUGET.md"
      - "CHANGELOG.md"
      - "platforms/dotnet/**"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  test-and-pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test
        run: dotnet test platforms/dotnet/tests/AutoPolicy.Tests/AutoPolicy.Tests.csproj --configuration Release

      - name: Pack
        run: dotnet pack platforms/dotnet/src/AutoPolicy/AutoPolicy.csproj --configuration Release --output artifacts

      - name: Validate package contents and metadata
        shell: pwsh
        run: ./platforms/dotnet/scripts/Validate-Packages.ps1 -ArtifactsPath ./artifacts

      - name: Restore packaged consumer smoke test
        run: >-
          dotnet restore platforms/dotnet/smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj
          --configfile platforms/dotnet/smoke/AutoPolicy.ConsumerSmoke/NuGet.config
          --packages artifacts/.smoke-packages
          --no-cache

      - name: Run packaged consumer smoke test
        run: dotnet run --project platforms/dotnet/smoke/AutoPolicy.ConsumerSmoke/AutoPolicy.ConsumerSmoke.csproj --configuration Release --no-restore

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: autopolicy-nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg
          if-no-files-found: error
          retention-days: 7
